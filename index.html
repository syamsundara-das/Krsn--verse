<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kṛṣṇa Verse</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Georgia, "Times New Roman", serif;
  background:#f8f4ec;
  color:#302b38;
}

header{
  background:#29213d;
  color:white;
  padding:24px 18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:7px 0 0;
  opacity:.85;
  font-size:14px;
}

main{
  max-width:850px;
  margin:auto;
  padding:25px 18px 50px;
}

.hero{
  text-align:center;
  padding:30px 10px;
}

.hero h2{
  font-size:30px;
  margin-bottom:10px;
}

.hero p{
  color:#6c6572;
  line-height:1.6;
}

.book-card{
  background:white;
  border-radius:16px;
  padding:25px;
  margin-top:25px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  cursor:pointer;
  transition:.2s;
}

.book-card:hover{
  transform:translateY(-2px);
}

.book-card h3{
  margin-top:0;
  color:#29213d;
  font-size:23px;
}

.book-card p{
  line-height:1.6;
  color:#6c6572;
}

.button{
  background:#29213d;
  color:white;
  border:none;
  border-radius:10px;
  padding:12px 17px;
  cursor:pointer;
  font-size:15px;
}

.back{
  margin-bottom:20px;
}

.chapter-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.chapter{
  background:white;
  padding:17px;
  border-radius:12px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  display:flex;
  gap:15px;
  align-items:center;
}

.chapter:hover{
  background:#f1ece3;
}

.chapter-number{
  color:#8b6b23;
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
}

.chapter-title{
  font-size:17px;
}

.reading{
  background:white;
  border-radius:16px;
  padding:28px 22px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.reading h2{
  font-size:30px;
  line-height:1.3;
  margin-top:8px;
  color:#29213d;
}

.reading-content{
  margin-top:25px;
}

.reading-paragraph{
  margin-bottom:20px;
  line-height:1.9;
  font-size:18px;
  color:#302b38;
}

.chapter-navigation{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:25px 0 10px;
  padding:18px 0;
}

.nav-button{
  background:#29213d;
  color:white;
  border:none;
  border-radius:10px;
  padding:12px 15px;
  cursor:pointer;
}

.chapter-count{
  color:#777;
  font-size:14px;
  white-space:nowrap;
}

.end-book{
  color:#8b6b23;
  font-size:14px;
  text-align:center;
}

.message{
  text-align:center;
  padding:40px 15px;
  color:#6c6572;
}

.loading{
  text-align:center;
  padding:40px;
}

@media(max-width:600px){

  header h1{
    font-size:26px;
  }

  .hero h2{
    font-size:26px;
  }

  .reading{
    padding:23px 17px;
  }

  .reading h2{
    font-size:25px;
  }

  .reading-paragraph{
    font-size:17px;
    line-height:1.85;
  }

  .chapter-navigation{
    flex-wrap:wrap;
  }

  .nav-button{
    flex:1;
  }

}

</style>
</head>

<body>

<header>
  <h1>Kṛṣṇa Verse</h1>
  <p>Read • Learn • Remember Kṛṣṇa</p>
</header>

<main id="app">

  <div class="loading">
    Loading...
  </div>

</main>

<script>

/* =========================
   SUPABASE CONNECTION
   ========================= */

const SUPABASE_URL = "https://ffwzwoqixyenmgianbhc.supabase.co";

const SUPABASE_KEY = "sb_publishable_PelAWcCcYnjnPqTa1GXfOw_WQgCWagU";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   MAIN APP
   ========================= */

const app = document.getElementById("app");


/* =========================
   SECURITY / TEXT DISPLAY
   ========================= */

function escapeHTML(text){

  if(text === null || text === undefined){
    return "";
  }

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   HOME PAGE
   ========================= */

async function showHome(){

  app.innerHTML = `
    <section class="hero">

      <h2>Welcome to Kṛṣṇa Verse</h2>

      <p>
        Explore the teachings and transcendental pastimes
        of Lord Kṛṣṇa.
      </p>

    </section>

    <div id="books">
      <div class="message">
        Loading books...
      </div>
    </div>
  `;

  await loadBooks();
}


/* =========================
   LOAD BOOKS
   ========================= */

async function loadBooks(){

  const { data, error } = await db
    .from("books")
    .select("*")
    .order("id");

  const booksDiv = document.getElementById("books");

  if(error){

    booksDiv.innerHTML = `
      <div class="message">
        Could not load books.<br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

    return;
  }

  if(!data || data.length === 0){

    booksDiv.innerHTML = `
      <div class="message">
        No books available yet.
      </div>
    `;

    return;
  }

  booksDiv.innerHTML = "";

  data.forEach(book => {

    booksDiv.innerHTML += `

      <div
        class="book-card"
        onclick="openBook(${book.id})"
      >

        <h3>
          ${escapeHTML(book.title)}
        </h3>

        ${
          book.subtitle
          ?
          `<p>${escapeHTML(book.subtitle)}</p>`
          :
          ""
        }

        ${
          book.description
          ?
          `<p>${escapeHTML(book.description)}</p>`
          :
          ""
        }

        <button class="button">
          Open Book →
        </button>

      </div>

    `;

  });

}


/* =========================
   OPEN BOOK
   ========================= */

async function openBook(bookId){

  app.innerHTML = `

    <button
      class="button back"
      onclick="showHome()"
    >
      ← Books
    </button>

    <div class="message">
      Loading chapters...
    </div>

  `;

  const { data: book, error: bookError } = await db
    .from("books")
    .select("*")
    .eq("id", bookId)
    .single();

  if(bookError){

    app.innerHTML = `
      <div class="message">
        Could not load book.<br><br>
        ${escapeHTML(bookError.message)}
      </div>
    `;

    return;
  }

  const { data: chapters, error } = await db
    .from("chapters")
    .select("*")
    .eq("book_id", bookId)
    .order("chapter_number");

  if(error){

    app.innerHTML = `
      <div class="message">
        Could not load chapters.<br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

    return;
  }

  let chapterHTML = "";

  chapters.forEach(chapter => {

    chapterHTML += `

      <div
        class="chapter"
        onclick="openChapter(${chapter.id})"
      >

        <div class="chapter-number">
          CHAPTER ${chapter.chapter_number}
        </div>

        <div class="chapter-title">
          ${escapeHTML(
            chapter.title_en ||
            chapter.title
          )}
        </div>

      </div>

    `;

  });

  app.innerHTML = `

    <button
      class="button back"
      onclick="showHome()"
    >
      ← Books
    </button>

    <div class="hero">

      <h2>
        ${escapeHTML(book.title)}
      </h2>

      <p>
        90 Chapters
      </p>

    </div>

    <div class="chapter-list">
      ${chapterHTML}
    </div>

  `;

}


/* =========================
   OPEN CHAPTER
   ========================= */

async function openChapter(chapterId){

  app.innerHTML = `

    <button
      class="button back"
      onclick="showBooks()"
    >
      ← Chapters
    </button>

    <div class="message">
      Loading chapter...
    </div>

  `;


  /* Get chapter information */

  const { data: chapter, error } = await db
    .from("chapters")
    .select("*")
    .eq("id", chapterId)
    .single();


  if(error){

    app.innerHTML = `

      <div class="message">

        Unable to open chapter.

        <br><br>

        ${escapeHTML(error.message)}

      </div>

    `;

    return;
  }


  /* Load complete Kṛṣṇa Book JSON */

  let bookData;

  try{

    const response = await fetch(
      "./krishna_chapters.json"
    );

    if(!response.ok){

      throw new Error(
        "Could not load krishna_chapters.json"
      );

    }

    bookData = await response.json();

  }
  catch(error){

    app.innerHTML = `

      <div class="message">

        Book content could not be loaded.

        <br><br>

        Make sure <b>krishna_chapters.json</b>
        is uploaded in the same folder as
        <b>index.html</b>.

        <br><br>

        ${escapeHTML(error.message)}

      </div>

    `;

    return;
  }


  /* Find current chapter */

  const currentNumber =
    Number(chapter.chapter_number);


  const currentChapter =
    bookData.chapters.find(
      c =>
        Number(c.chapter_number)
        === currentNumber
    );


  if(!currentChapter){

    app.innerHTML = `

      <div class="message">

        Chapter ${currentNumber}
        was not found.

      </div>

    `;

    return;
  }


  /* Create reading content */

  let content = "";


  currentChapter.paragraphs.forEach(
    paragraph => {

      content += `

        <p class="reading-paragraph">
          ${escapeHTML(paragraph)}
        </p>

      `;

    }
  );


  /* Previous chapter */

  const previousChapter =
    bookData.chapters.find(
      c =>
        Number(c.chapter_number)
        === currentNumber - 1
    );


  /* Next chapter */

  const nextChapter =
    bookData.chapters.find(
      c =>
        Number(c.chapter_number)
        === currentNumber + 1
    );


  /* Navigation */

  let navigation = `

    <div class="chapter-navigation">

  `;


  if(previousChapter){

    navigation += `

      <button
        class="nav-button"
        onclick="openChapterByNumber(
          ${previousChapter.chapter_number}
        )"
      >

        ← Chapter
        ${previousChapter.chapter_number}

      </button>

    `;

  }
  else{

    navigation += `

      <button
        class="nav-button"
        onclick="showBooks()"
      >

        ← Chapters

      </button>

    `;

  }


  navigation += `

    <div class="chapter-count">

      ${currentNumber} / 90

    </div>

  `;


  if(nextChapter){

    navigation += `

      <button
        class="nav-button"
        onclick="openChapterByNumber(
          ${nextChapter.chapter_number}
        )"
      >

        Chapter
        ${nextChapter.chapter_number}
        →

      </button>

    `;

  }
  else{

    navigation += `

      <div class="end-book">

        End of Kṛṣṇa Book

      </div>

    `;

  }


  navigation += `

    </div>

  `;


  /* Display chapter */

  app.innerHTML = `

    <button
      class="button back"
      onclick="showBooks()"
    >
      ← Chapters
    </button>


    <article class="reading">

      <div class="chapter-number">

        CHAPTER ${currentNumber}

      </div>


      <h2>

        ${escapeHTML(
          currentChapter.title
        )}

      </h2>


      <div class="reading-content">

        ${content}

      </div>

    </article>


    ${navigation}

  `;

}


/* =========================
   OPEN CHAPTER BY NUMBER
   ========================= */

async function openChapterByNumber(
  chapterNumber
){

  const { data: book, error: bookError } =
    await db
      .from("books")
      .select("id")
      .eq(
        "title",
        "Kṛṣṇa, the Supreme Personality of Godhead"
      )
      .single();


  if(bookError){

    alert("Could not find the Kṛṣṇa Book.");

    return;
  }


  const { data: chapter, error } =
    await db
      .from("chapters")
      .select("id")
      .eq(
        "book_id",
        book.id
      )
      .eq(
        "chapter_number",
        chapterNumber
      )
      .single();


  if(error){

    alert("Could not open chapter.");

    return;
  }


  openChapter(chapter.id);

}


/* =========================
   SHOW CHAPTERS
   ========================= */

async function showBooks(){

  const { data: book, error } =
    await db
      .from("books")
      .select("*")
      .eq(
        "title",
        "Kṛṣṇa, the Supreme Personality of Godhead"
      )
      .single();


  if(error){

    showHome();

    return;
  }


  openBook(book.id);

}


/* =========================
   START WEBSITE
   ========================= */

showHome();

</script>

</body>
</html>
