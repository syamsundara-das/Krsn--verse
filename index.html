<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kṛṣṇa Verse</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #f7f3ea;
      color: #211f2b;
    }

    header {
      background: linear-gradient(135deg, #17133b, #2c2462);
      color: white;
      padding: 28px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 0.3px;
    }

    header p {
      margin: 8px 0 0;
      font-family: Arial, sans-serif;
      font-size: 14px;
      opacity: 0.85;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 24px 16px 60px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.07);
    }

    .book-title {
      font-size: 29px;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 16px;
      margin-bottom: 24px;
    }

    .description {
      color: #555;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    h2 {
      margin-top: 0;
      font-size: 24px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 15px 16px;
      margin: 6px 0;
      background: #eee9dc;
      color: #25222d;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #e4dece;
    }

    .primary-button {
      background: #211a4c;
      color: white;
      text-align: center;
    }

    .primary-button:hover {
      background: #30266b;
    }

    .chapter-button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
    }

    .chapter-info {
      display: block;
    }

    .chapter-number {
      font-size: 14px;
      color: #777;
      margin-bottom: 4px;
    }

    .chapter-name {
      font-size: 17px;
      line-height: 1.4;
    }

    .arrow {
      font-size: 25px;
      color: #777;
      margin-left: 10px;
    }

    .reading {
      background: #fff;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.07);
    }

    .chapter-label {
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 1.8px;
      color: #777;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .chapter-title {
      text-align: center;
      font-size: 31px;
      line-height: 1.3;
      margin: 0 0 30px;
    }

    .introduction-title {
      text-align: center;
      font-size: 31px;
      line-height: 1.3;
      margin: 0 0 30px;
    }

    .content {
      width: 100%;
    }

    .content p {
      font-size: 18px;
      line-height: 1.85;
      margin: 0 0 21px;
    }

    .content h3 {
      font-size: 22px;
      margin-top: 30px;
    }

    .back-button {
      background: #211a4c;
      color: white;
      text-align: center;
      margin-bottom: 18px;
    }

    .back-button:hover {
      background: #30266b;
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
      margin-top: 35px;
      border-top: 1px solid #e5e0d5;
      padding-top: 20px;
    }

    .nav-buttons button {
      flex: 1;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 60px 15px;
      color: #777;
      font-family: Arial, sans-serif;
    }

    .error {
      background: #fff0f0;
      border: 1px solid #f0cccc;
      color: #8d2222;
      border-radius: 14px;
      padding: 20px;
      line-height: 1.7;
      font-family: Arial, sans-serif;
    }

    .empty-content {
      text-align: center;
      color: #777;
      padding: 30px 10px;
    }

    @media (max-width: 600px) {

      header {
        padding: 23px 15px;
      }

      header h1 {
        font-size: 27px;
      }

      main {
        padding: 16px 12px 45px;
      }

      .card {
        padding: 20px 16px;
        border-radius: 15px;
      }

      .book-title {
        font-size: 25px;
      }

      .reading {
        padding: 23px 16px;
        border-radius: 15px;
      }

      .chapter-title,
      .introduction-title {
        font-size: 26px;
      }

      .content p {
        font-size: 17px;
        line-height: 1.8;
      }

      .nav-buttons {
        gap: 8px;
      }

      .nav-buttons button {
        font-size: 14px;
        padding: 13px 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Kṛṣṇa Verse</h1>
  <p>Śrīla Prabhupāda's teachings</p>
</header>

<main id="app">
  <div class="loading">
    Loading Kṛṣṇa Book...
  </div>
</main>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "Ymhttps://ffwzwoqixyenmgianbhc.supabase.co";
const SUPABASE_KEY = "sb_publishable_PelAWcCcYnjnPqTa1GXfOw_WQgCWagU";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   GLOBAL DATA
========================================================= */

let bookData = [];
let currentChapterIndex = null;


/* =========================================================
   LOAD JSON BOOK CONTENT
========================================================= */

async function loadBook() {

  try {

    const response = await fetch(
      "./krishna_chapters.json"
    );

    if (!response.ok) {

      throw new Error(
        "Could not load krishna_chapters.json"
      );

    }

    const json = await response.json();


    /*
      Your JSON structure is:

      {
        "book": {...},
        "chapters": [...]
      }

      Therefore we use json.chapters.
    */

    if (
      !json ||
      !Array.isArray(json.chapters)
    ) {

      throw new Error(
        "Invalid JSON structure. The file must contain a chapters array."
      );

    }


    bookData = json.chapters;


    /* Make sure only Chapters 1–90 are used */

    bookData = bookData
      .filter(chapter => {

        const number =
          Number(chapter.chapter_number);

        return number >= 1 && number <= 90;

      })
      .sort((a, b) => {

        return (
          Number(a.chapter_number) -
          Number(b.chapter_number)
        );

      });


    showHome();

  } catch (error) {

    document.getElementById("app").innerHTML = `

      <div class="error">

        <strong>
          Book content could not be loaded.
        </strong>

        <br><br>

        Make sure
        <b>krishna_chapters.json</b>
        is uploaded in the same GitHub folder as
        <b>index.html</b>.

        <br><br>

        ${escapeHTML(error.message)}

      </div>

    `;

  }

}


/* =========================================================
   HOME / BOOK PAGE
========================================================= */

function showHome() {

  document.getElementById("app").innerHTML = `

    <div class="card">

      <div class="book-title">
        Kṛṣṇa, the Supreme Personality of Godhead
      </div>

      <div class="subtitle">
        Kṛṣṇa Book
      </div>

      <div class="description">
        The transcendental pastimes of Lord Kṛṣṇa.
      </div>

      <button
        class="primary-button"
        onclick="showIntroduction()">

        Read Introduction

      </button>

    </div>


    <div class="card">

      <h2>
        Chapters
      </h2>

      <div id="chapterList"></div>

    </div>

  `;


  const chapterList =
    document.getElementById("chapterList");


  if (bookData.length === 0) {

    chapterList.innerHTML = `
      <div class="empty-content">
        No chapters found.
      </div>
    `;

    return;

  }


  bookData.forEach(
    (chapter, index) => {

      const number =
        chapter.chapter_number ||
        index + 1;

      const title =
        chapter.title_en ||
        chapter.title ||
        `Chapter ${number}`;


      chapterList.innerHTML += `

        <button
          class="chapter-button"
          onclick="openChapter(${index})">

          <span class="chapter-info">

            <span class="chapter-number">
              Chapter ${number}
            </span>

            <span class="chapter-name">
              ${escapeHTML(title)}
            </span>

          </span>

          <span class="arrow">
            ›
          </span>

        </button>

      `;

    }
  );

}


/* =========================================================
   INTRODUCTION
========================================================= */

function showIntroduction() {

  document.getElementById("app").innerHTML = `

    <button
      class="back-button"
      onclick="showHome()">

      ← Back to Kṛṣṇa Book

    </button>


    <article class="reading">

      <h1 class="introduction-title">
        Introduction
      </h1>


      <div class="content">

        <!--
          INSERT THE EXACT INTRODUCTION TEXT
          FROM THE KṚṢṆA BOOK HERE.

          Do not add Dedication or Preface.
        -->

        <p>
          The Introduction text will be placed here
          from the Kṛṣṇa Book source.
        </p>

      </div>


      <div class="nav-buttons">

        <button
          onclick="openChapter(0)">

          Begin Chapter 1 →

        </button>

      </div>

    </article>

  `;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================================================
   OPEN CHAPTER
========================================================= */

function openChapter(index) {

  if (
    index < 0 ||
    index >= bookData.length
  ) {

    return;

  }


  currentChapterIndex = index;


  const chapter =
    bookData[index];


  const number =
    chapter.chapter_number ||
    index + 1;


  const title =
    chapter.title_en ||
    chapter.title ||
    `Chapter ${number}`;


  let paragraphs = [];


  /* -------------------------------------------------------
     JSON FORMAT 1
     chapter.paragraphs
  ------------------------------------------------------- */

  if (
    Array.isArray(
      chapter.paragraphs
    )
  ) {

    paragraphs =
      chapter.paragraphs;

  }


  /* -------------------------------------------------------
     JSON FORMAT 2
     chapter.sections
  ------------------------------------------------------- */

  else if (
    Array.isArray(
      chapter.sections
    )
  ) {

    chapter.sections.forEach(
      section => {

        if (
          Array.isArray(
            section.paragraphs
          )
        ) {

          paragraphs.push(
            ...section.paragraphs
          );

        }

        else if (
          section.content_en
        ) {

          paragraphs.push(
            section.content_en
          );

        }

        else if (
          section.content
        ) {

          paragraphs.push(
            section.content
          );

        }

      }
    );

  }


  /* -------------------------------------------------------
     JSON FORMAT 3
     chapter.content
  ------------------------------------------------------- */

  else if (
    chapter.content
  ) {

    paragraphs = [
      chapter.content
    ];

  }


  /* =======================================================
     CREATE READING CONTENT
  ======================================================= */

  let contentHTML = "";


  if (
    paragraphs.length === 0
  ) {

    contentHTML = `

      <div class="empty-content">

        Reading content will be added here.

      </div>

    `;

  }

  else {

    paragraphs.forEach(
      paragraph => {

        if (
          paragraph === null ||
          paragraph === undefined ||
          String(paragraph).trim() === ""
        ) {

          return;

        }


        contentHTML += `

          <p>
            ${escapeHTML(
              String(paragraph)
            )}
          </p>

        `;

      }
    );

  }


  /* =======================================================
     PREVIOUS BUTTON
  ======================================================= */

  let previousButton = "";


  if (index > 0) {

    previousButton = `

      <button
        onclick="openChapter(${index - 1})">

        ← Previous

      </button>

    `;

  }

  else {

    /*
      Chapter 1 goes back to Introduction.
    */

    previousButton = `

      <button
        onclick="showIntroduction()">

        ← Introduction

      </button>

    `;

  }


  /* =======================================================
     NEXT BUTTON
  ======================================================= */

  let nextButton = "";


  if (
    index <
    bookData.length - 1
  ) {

    nextButton = `

      <button
        onclick="openChapter(${index + 1})">

        Next →

      </button>

    `;

  }

  else {

    /*
      Chapter 90 is the final chapter.

      Nothing after Chapter 90.
    */

    nextButton = `

      <button
        onclick="showHome()">

        Back to Chapters

      </button>

    `;

  }


  /* =======================================================
     DISPLAY CHAPTER
  ======================================================= */

  document.getElementById("app").innerHTML = `

    <button
      class="back-button"
      onclick="showHome()">

      ← Back to Chapters

    </button>


    <article class="reading">

      <div class="chapter-label">

        Chapter ${number}

      </div>


      <h1 class="chapter-title">

        ${escapeHTML(title)}

      </h1>


      <div class="content">

        ${contentHTML}

      </div>


      <div class="nav-buttons">

        ${previousButton}

        ${nextButton}

      </div>

    </article>

  `;


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================================================
   OPEN CHAPTER BY NUMBER
========================================================= */

function openChapterByNumber(number) {

  const index =
    bookData.findIndex(
      chapter =>
        Number(
          chapter.chapter_number
        ) === Number(number)
    );


  if (index !== -1) {

    openChapter(index);

  }

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   START WEBSITE
========================================================= */

loadBook();

</script>

</body>
</html>
