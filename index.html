    .from("books")

  async function openChapter(chapterId){

  app.innerHTML = `

    </button>

    <div class="message">
      Loading chapter...
    </div>
  `;

  // Get chapter number from Supabase
  const { data: chapter, error } = await db
    .from("chapters")
    .select("*")

  if(error){

        Unable to open chapter.<br><br>
        ${escapeHTML(error.message)}
      </div>
    `;
    return;
  }

  // Load the actual book content
  let bookData;

  try {
    const response = await fetch("./krishna_chapters.json");

    if(!response.ok){
      throw new Error("Could not load book content.");
    }

    bookData = await response.json();

  } catch(error) {

    app.innerHTML = `
      <div class="message">
        Book content could not be loaded.<br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

    return;
  }

  const currentNumber = Number(chapter.chapter_number);

  const currentChapter = bookData.chapters.find(
    c => c.chapter_number === currentNumber
  );

  if(!currentChapter){

    app.innerHTML = `
      <div class="message">
        Chapter ${currentNumber} was not found.
      </div>
    `;

    return;
  }

  let content = "";

  currentChapter.paragraphs.forEach(paragraph => {

    content += `
      <p class="reading-paragraph">
        ${escapeHTML(paragraph)}
      </p>
    `;

  });

  const previousChapter =
    bookData.chapters.find(
      c => c.chapter_number === currentNumber - 1
    );

  const nextChapter =
    bookData.chapters.find(
      c => c.chapter_number === currentNumber + 1
    );

  let navigation = `
    <div class="chapter-navigation">
  `;

  if(previousChapter){

    navigation += `
      <button
        class="nav-button"
        onclick="openChapterByNumber(${previousChapter.chapter_number})">
        ← Chapter ${previousChapter.chapter_number}
      </button>
    `;

  } else {

    navigation += `
      <button
        class="nav-button"
        onclick="showBooks()">
        ← Chapters
      </button>
    `;

  }

  navigation += `
    <div class="chapter-count">
      ${currentNumber} / 90
    </div>
  `;

  if(nextChapter){

    navigation += `
      <button
        class="nav-button"
        onclick="openChapterByNumber(${nextChapter.chapter_number})">
        Chapter ${nextChapter.chapter_number} →
      </button>
    `;

  } else {

    navigation += `
      <div class="end-book">
        End of Kṛṣṇa Book
      </div>
    `;

  }

  navigation += `</div>`;

  app.innerHTML = `

    <button
      class="button back"
      onclick="showBooks()">
      ← Chapters
    </button>

    <article class="reading">

      <div class="chapter-number">
        CHAPTER ${currentNumber}
      </div>

      <h2>
        ${escapeHTML(currentChapter.title)}
      </h2>

      <div class="reading-content">
        ${content}
      </div>

    </article>

    ${navigation}

  `;
}

}

    </button>

  `;

/* OPEN CHAPTER */

async function openChapter(chapterId){

  app.innerHTML = `
    <button class="button back" onclick="history.back()">
      ← Back
    </button>

    <div class="message">
      Loading chapter...
    </div>
  `;

  const { data: chapter, error: chapterError } =
    await db
      .from("chapters")
      .select("*")
      .eq("id", chapterId)
      .single();

  if(chapterError){

    app.innerHTML += `
      <div class="message">
        ${chapterError.message}
      </div>
    `;

    return;
  }

  const { data: sections, error: sectionError } =
    await db
      .from("sections")
      .select("*")
      .eq("chapter_id", chapterId)
      .order("section_number");

  let content = "";

  if(!sectionError && sections && sections.length > 0){

    sections.forEach(section => {

      const text =
        section.content_en || "";

      if(text){

        content += `
          <p style="margin-bottom:20px;">
            ${escapeHTML(text)}
          </p>
        `;
      }
    });
  }

  if(!content){

    content = `
      <p>
        The chapter structure is ready.
      </p>

      <p style="margin-top:15px;color:#777;">
        Reading content will be added here.
      </p>
    `;
  }

  const title =
    chapter.title_en ||
    chapter.title ||
    "Chapter";

  app.innerHTML = `

    <button
      class="button back"

    </button>

    <div class="reading">

      <div class="chapter-number">
        CHAPTER ${chapter.chapter_number}
      </div>

      <h2>
        ${escapeHTML(title)}
      </h2>

      ${content}

    </div>
  `;
}

/* ESCAPE HTML */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
